<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1100" height="720" rx="12" fill="#0f172a"/>
  <rect x="16" y="16" width="1068" height="688" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="550" y="48" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Exact Physical Pinout &amp; Wiring — RP2040-Zero (AliExpress #1005009048313892)</text>
  <text x="550" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">True 23-Pad Physical Layout (9 Left + 5 Bottom + 9 Right, USB-C at Top)</text>

  <!-- ==================== CENTER: EXACT RP2040-ZERO 23-PIN BOARD ==================== -->
  <g transform="translate(390, 125)">
    <!-- PCB Body (Blue RP2040-Zero) -->
    <rect x="0" y="0" width="320" height="450" rx="16" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>

    <!-- USB-C Connector at Top -->
    <rect x="105" y="-18" width="110" height="36" rx="6" fill="#cbd5e1" stroke="#f8fafc" stroke-width="2"/>
    <text x="160" y="5" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">USB-C (Top)</text>

    <!-- Board Header Label -->
    <text x="160" y="46" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">RP2040-Zero</text>

    <!-- BOOT & RESET Buttons -->
    <rect x="65" y="65" width="56" height="30" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="93" cy="80" r="7" fill="#0f172a"/>
    <text x="93" y="109" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="700">BOOT</text>

    <rect x="199" y="65" width="56" height="30" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <circle cx="227" cy="80" r="7" fill="#0f172a"/>
    <text x="227" y="109" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="700">RESET</text>

    <!-- On-board WS2812 RGB LED (GP16) -->
    <rect x="132" y="120" width="56" height="34" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="160" cy="133" r="6" fill="#22c55e"/>
    <text x="160" y="149" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">RGB GP16</text>

    <!-- RP2040 MCU Chip -->
    <rect x="105" y="185" width="110" height="110" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="160" y="235" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">RP2040</text>
    <text x="160" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">Dual Cortex-M0+</text>

    <!-- ==================== LEFT SIDE: 9 PINS (Top to Bottom) ==================== -->
    <!-- Pin L1: 5V -->
    <rect x="-8" y="45" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="18" y="60" fill="#cbd5e1" font-size="13" font-weight="600">5V</text>

    <!-- Pin L2: GND -->
    <rect x="-8" y="85" width="18" height="20" rx="3" fill="#64748b" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="18" y="100" fill="#ffffff" font-size="13" font-weight="700">GND</text>

    <!-- Pin L3: 3V3 -->
    <rect x="-8" y="125" width="18" height="20" rx="3" fill="#ef4444" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="18" y="140" fill="#fca5a5" font-size="13" font-weight="700">3V3</text>

    <!-- Pin L4: GP29 -->
    <rect x="-8" y="165" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="18" y="180" fill="#94a3b8" font-size="13">GP29 (A3)</text>

    <!-- Pin L5: GP28 -->
    <rect x="-8" y="205" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="18" y="220" fill="#94a3b8" font-size="13">GP28 (A2)</text>

    <!-- Pin L6: GP27 (A1 -> Sensor 2) -->
    <rect x="-8" y="245" width="18" height="20" rx="3" fill="#fb923c" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="18" y="260" fill="#fdba74" font-size="13" font-weight="700">GP27 (A1)</text>

    <!-- Pin L7: GP26 (A0 -> Sensor 1) -->
    <rect x="-8" y="285" width="18" height="20" rx="3" fill="#facc15" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="18" y="300" fill="#fde047" font-size="13" font-weight="700">GP26 (A0)</text>

    <!-- Pin L8: GP15 -->
    <rect x="-8" y="325" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="18" y="340" fill="#94a3b8" font-size="13">GP15</text>

    <!-- Pin L9: GP14 -->
    <rect x="-8" y="365" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="18" y="380" fill="#94a3b8" font-size="13">GP14</text>

    <!-- ==================== BOTTOM EDGE: 5 PINS (Left to Right: GP13..GP9) ==================== -->
    <rect x="45" y="438" width="22" height="18" rx="3" fill="#eab308"/>
    <text x="56" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">GP13</text>

    <rect x="97" y="438" width="22" height="18" rx="3" fill="#eab308"/>
    <text x="108" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">GP12</text>

    <rect x="149" y="438" width="22" height="18" rx="3" fill="#eab308"/>
    <text x="160" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">GP11</text>

    <rect x="201" y="438" width="22" height="18" rx="3" fill="#eab308"/>
    <text x="212" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">GP10</text>

    <rect x="253" y="438" width="22" height="18" rx="3" fill="#eab308"/>
    <text x="264" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">GP9</text>

    <!-- ==================== RIGHT SIDE: 9 PINS (Top to Bottom: GP0..GP8) ==================== -->
    <!-- Pin R1: GP0 -->
    <rect x="310" y="45" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="302" y="60" text-anchor="end" fill="#94a3b8" font-size="13">GP0</text>

    <!-- Pin R2: GP1 -->
    <rect x="310" y="85" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="302" y="100" text-anchor="end" fill="#94a3b8" font-size="13">GP1</text>

    <!-- Pin R3: GP2 (Tare Button) -->
    <rect x="310" y="125" width="18" height="20" rx="3" fill="#eab308" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="302" y="140" text-anchor="end" fill="#fde047" font-size="13" font-weight="700">GP2 (Tare)</text>

    <!-- Pin R4: GP3 -->
    <rect x="310" y="165" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="302" y="180" text-anchor="end" fill="#94a3b8" font-size="13">GP3</text>

    <!-- Pin R5: GP4 (OLED SDA) -->
    <rect x="310" y="205" width="18" height="20" rx="3" fill="#4ade80" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="302" y="220" text-anchor="end" fill="#86efac" font-size="13" font-weight="700">GP4 (SDA)</text>

    <!-- Pin R6: GP5 (OLED SCL) -->
    <rect x="310" y="245" width="18" height="20" rx="3" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="302" y="260" text-anchor="end" fill="#7dd3fc" font-size="13" font-weight="700">GP5 (SCL)</text>

    <!-- Pin R7: GP6 -->
    <rect x="310" y="285" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="302" y="300" text-anchor="end" fill="#94a3b8" font-size="13">GP6</text>

    <!-- Pin R8: GP7 -->
    <rect x="310" y="325" width="18" height="20" rx="3" fill="#eab308"/>
    <text x="302" y="340" text-anchor="end" fill="#94a3b8" font-size="13">GP7</text>

    <!-- Pin R9: GP8 (Buzzer +) -->
    <rect x="310" y="365" width="18" height="20" rx="3" fill="#f472b6" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="302" y="380" text-anchor="end" fill="#f9a8d4" font-size="13" font-weight="700">GP8 (Buzzer)</text>
  </g>

  <!-- ==================== LEFT PERIPHERALS: DUAL S49E HALL SENSORS ==================== -->
  <!-- S49E Sensor 1 (Front -> GP26) -->
  <g transform="translate(50, 355)">
    <rect x="0" y="0" width="235" height="140" rx="10" fill="#0f172a" stroke="#facc15" stroke-width="2.5"/>
    <text x="117" y="26" text-anchor="middle" fill="#facc15" font-size="15" font-weight="700">S49E Hall Sensor #1</text>
    <text x="117" y="44" text-anchor="middle" fill="#94a3b8" font-size="11">Flat Face Forward (Leads Down)</text>
    <text x="215" y="75" text-anchor="end" fill="#f87171" font-size="13" font-weight="700">Pin 1 (Left): VCC (3.3V)</text>
    <text x="215" y="100" text-anchor="end" fill="#cbd5e1" font-size="13" font-weight="700">Pin 2 (Center): GND</text>
    <text x="215" y="125" text-anchor="end" fill="#facc15" font-size="13" font-weight="700">Pin 3 (Right): OUT → GP26</text>
  </g>

  <!-- S49E Sensor 2 (Rear -> GP27) -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="235" height="140" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="2.5"/>
    <text x="117" y="26" text-anchor="middle" fill="#fb923c" font-size="15" font-weight="700">S49E Hall Sensor #2</text>
    <text x="117" y="44" text-anchor="middle" fill="#94a3b8" font-size="11">4–6 mm Behind Sensor #1</text>
    <text x="215" y="75" text-anchor="end" fill="#f87171" font-size="13" font-weight="700">Pin 1 (Left): VCC (3.3V)</text>
    <text x="215" y="100" text-anchor="end" fill="#cbd5e1" font-size="13" font-weight="700">Pin 2 (Center): GND</text>
    <text x="215" y="125" text-anchor="end" fill="#fb923c" font-size="13" font-weight="700">Pin 3 (Right): OUT → GP27</text>
  </g>

  <!-- ==================== RIGHT PERIPHERALS: BUTTON, OLED, BUZZER ==================== -->
  <!-- Tare Button (GP2) -->
  <g transform="translate(815, 130)">
    <rect x="0" y="0" width="235" height="80" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
    <text x="117" y="24" text-anchor="middle" fill="#fde047" font-size="14" font-weight="700">Tare Button (Optional)</text>
    <text x="20" y="48" fill="#fde047" font-size="12" font-weight="700">Pin A → GP2 (3rd pin right)</text>
    <text x="20" y="68" fill="#cbd5e1" font-size="12" font-weight="700">Pin B → GND</text>
  </g>

  <!-- 0.96" I2C OLED Display -->
  <g transform="translate(815, 240)">
    <rect x="0" y="0" width="235" height="190" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="117" y="26" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">0.96" I2C OLED (SSD1306)</text>
    <rect x="28" y="38" width="180" height="65" rx="4" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <text x="40" y="58" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700">OK - GRAD</text>
    <text x="40" y="75" fill="#38bdf8" font-family="monospace" font-size="11">Dif: 8 (Lim: 40)</text>
    <rect x="40" y="83" width="150" height="12" fill="none" stroke="#ffffff" stroke-width="1"/>
    <rect x="42" y="85" width="32" height="8" fill="#22c55e"/>

    <text x="20" y="124" fill="#4ade80" font-size="13" font-weight="700">SDA → GP4 (5th pin right)</text>
    <text x="20" y="144" fill="#38bdf8" font-size="13" font-weight="700">SCL → GP5 (6th pin right)</text>
    <text x="20" y="164" fill="#f87171" font-size="13" font-weight="700">VCC → 3V3 (3rd pin left)</text>
    <text x="20" y="182" fill="#cbd5e1" font-size="13" font-weight="700">GND → GND (2nd pin left)</text>
  </g>

  <!-- SFM-20B Active Buzzer -->
  <g transform="translate(815, 460)">
    <rect x="0" y="0" width="235" height="115" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="2.5"/>
    <circle cx="202" cy="36" r="22" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="202" cy="36" r="7" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="18" y="30" fill="#f472b6" font-size="15" font-weight="700">SFM-20B Buzzer</text>
    <text x="18" y="48" fill="#94a3b8" font-size="11">95 dB Active (3–24V DC)</text>
    <text x="18" y="78" fill="#f472b6" font-size="12.5" font-weight="700">(+) Red → GP8 (9th pin right)</text>
    <text x="18" y="100" fill="#cbd5e1" font-size="12.5" font-weight="700">(-) Black → GND (2nd pin left)</text>
  </g>

  <!-- ==================== WIRES: LEFT SIDE ==================== -->
  <!-- 3V3 (Pin L3: y=125+135=260) Red Bus -->
  <path d="M 382 260 L 330 260 L 330 245 L 285 245" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <path d="M 330 260 L 330 430 L 285 430" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <!-- 3V3 over top to right side OLED VCC -->
  <path d="M 330 245 L 330 95 L 775 95 L 775 400 L 815 400" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- GND (Pin L2: y=125+95=220) Grey/Black Bus -->
  <path d="M 382 220 L 310 220 L 310 270 L 285 270" fill="none" stroke="#64748b" stroke-width="3.5"/>
  <path d="M 310 270 L 310 455 L 285 455" fill="none" stroke="#64748b" stroke-width="3.5"/>
  <!-- GND under bottom to right side Button, OLED, Buzzer -->
  <path d="M 310 455 L 310 625 L 755 625 L 755 195 L 815 195" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 755 418 L 815 418" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 755 555 L 815 555" fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- Sensor 2 OUT -> GP27 (Pin L6: y=125+255=380) -->
  <path d="M 285 295 L 355 295 L 355 380 L 382 380" fill="none" stroke="#fb923c" stroke-width="3.5"/>

  <!-- Sensor 1 OUT -> GP26 (Pin L7: y=125+295=420) -->
  <path d="M 285 480 L 355 480 L 355 420 L 382 420" fill="none" stroke="#facc15" stroke-width="3.5"/>

  <!-- ==================== WIRES: RIGHT SIDE ==================== -->
  <!-- GP2 (Pin R3: y=125+135=260) -> Tare Button -->
  <path d="M 718 260 L 740 260 L 740 175 L 815 175" fill="none" stroke="#eab308" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- GP4 (Pin R5: y=125+215=340) -> OLED SDA -->
  <path d="M 718 340 L 790 340 L 790 360 L 815 360" fill="none" stroke="#4ade80" stroke-width="3.5"/>

  <!-- GP5 (Pin R6: y=125+255=380) -> OLED SCL -->
  <path d="M 718 380 L 815 380" fill="none" stroke="#38bdf8" stroke-width="3.5"/>

  <!-- GP8 (Pin R9: y=125+375=500) -> Buzzer (+) -->
  <path d="M 718 500 L 790 500 L 790 532 L 815 532" fill="none" stroke="#f472b6" stroke-width="3.5"/>

  <!-- Footer Summary Bar -->
  <rect x="50" y="648" width="1000" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="673" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600">
    Physical Pin Order (USB-C Up): Left 1–9 = [5V, GND, 3V3, GP29, GP28, GP27, GP26, GP15, GP14]  |  Bottom 5 = [GP13..GP9]  |  Right 1–9 = [GP0..GP8]
  </text>
</svg>
